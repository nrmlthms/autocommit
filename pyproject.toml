[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazycommit-cli"
version = "0.1.0"
description = "Automatic git commit and push tool with LLM-generated commit messages"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "nrmlthms", email = "nrmlthms@users.noreply.github.com"}
]
keywords = ["git", "commit", "automation", "llm", "openai", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "openai>=1.0.0",
    "twine>=6.2.0",
]

[project.optional-dependencies]
monitor = [
    "watchfiles>=0.21.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
lazycommit = "autocommit.cli:main"

[project.urls]
Homepage = "https://github.com/nrmlthms/autocommit"
Repository = "https://github.com/nrmlthms/autocommit"
Issues = "https://github.com/nrmlthms/autocommit/issues"

[tool.hatch.build.targets.wheel]
packages = ["autocommit"]
